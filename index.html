<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #f1f5f9;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Player bar ────────────────────────────────────────────── */
    .player-bar {
      width: 100%;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .player-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .avatar-white { background: rgba(241,245,249,0.12); border: 2px solid rgba(241,245,249,0.25); }
    .avatar-black { background: rgba(15,23,42,0.8);    border: 2px solid rgba(100,116,139,0.35); }

    .player-info { flex: 1; min-width: 0; }
    .player-name {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .player-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
      margin-top: 1px;
    }

    .active-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f97316;
      box-shadow: 0 0 6px #f97316;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .active-dot.on { opacity: 1; }

    /* ── Board ─────────────────────────────────────────────────── */
    #board-wrap {
      flex-shrink: 0;
      position: relative;
    }

    #board {
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .sq-highlight-src { background: rgba(249,115,22,0.45) !important; }
    .sq-highlight-dst { background: rgba(249,115,22,0.22) !important; }

    /* ── Status bar ─────────────────────────────────────────────── */
    #status-bar {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
    }

    .ctrl-btn {
      width: 46px; height: 46px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s, transform 0.1s;
      border: 1.5px solid;
    }
    .ctrl-btn-primary { background: rgba(249,115,22,0.12); border-color: rgba(249,115,22,0.3); color: #f97316; }
    .ctrl-btn-muted   { background: rgba(100,116,139,0.08); border-color: rgba(100,116,139,0.2); color: #475569; }
    .ctrl-btn:active  { transform: scale(0.9); opacity: 0.75; }

    #status-text {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #f97316;
    }

    /* ── Game-over overlay ──────────────────────────────────────── */
    #gameover {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    #gameover.show { display: flex; }

    .result-card {
      background: #1e293b;
      border: 1.5px solid rgba(249,115,22,0.3);
      border-radius: 22px;
      padding: 32px 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 280px;
      width: 82vw;
    }
    .result-emoji  { font-size: 54px; line-height: 1; }
    .result-title  { font-size: 22px; font-weight: 900; color: #f1f5f9; margin-top: 4px; }
    .result-sub    { font-size: 13px; color: #64748b; font-weight: 600; text-align: center; }

    .result-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      margin-top: 6px;
      transition: opacity 0.1s;
    }
    .result-btn:active { opacity: 0.75; }
    .result-btn-primary { background: #f97316; color: #fff; border: none; }
    .result-btn-ghost   { background: transparent; color: #64748b; border: 1.5px solid rgba(100,116,139,0.25); }
  </style>
</head>
<body>
<div id="app">
  <!-- Opponent row -->
  <div class="player-bar">
    <div class="player-avatar" id="avatar-top"></div>
    <div class="player-info">
      <div class="player-name" id="name-top">Oponente</div>
      <div class="player-label" id="label-top"></div>
    </div>
    <div class="active-dot" id="dot-top"></div>
  </div>

  <!-- Board -->
  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <!-- Status + controls -->
  <div id="status-bar">
    <button class="ctrl-btn ctrl-btn-muted"   id="btn-undo">↩</button>
    <div id="status-text">Tu turno</div>
    <button class="ctrl-btn ctrl-btn-primary" id="btn-new">↺</button>
  </div>

  <!-- Player row -->
  <div class="player-bar" style="flex-direction:row-reverse">
    <div class="player-avatar" id="avatar-bottom"></div>
    <div class="player-info" style="text-align:right">
      <div class="player-name" id="name-bottom">Tú</div>
      <div class="player-label" id="label-bottom"></div>
    </div>
    <div class="active-dot" id="dot-bottom"></div>
  </div>
</div>

<!-- Game over overlay -->
<div id="gameover">
  <div class="result-card">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <div class="result-title" id="result-title">¡Ganaste!</div>
    <div class="result-sub"   id="result-sub">Jaque mate</div>
    <button class="result-btn result-btn-primary" id="btn-play-again">↺ Nueva partida</button>
    <button class="result-btn result-btn-ghost"   id="btn-close-result">Cerrar</button>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script>
(function () {
  /* ── URL config ─────────────────────────────────────────────── */
  var P     = new URLSearchParams(location.search);
  var MODE  = P.get('mode')  || 'ai';     // 'ai' | 'friend'
  var CLR   = P.get('color') || 'white';  // 'white' | 'black'
  var IS_AI = MODE === 'ai';
  var AI_CLR = CLR === 'white' ? 'black' : 'white';

  /* ── State ──────────────────────────────────────────────────── */
  var game      = new Chess();
  var board     = null;
  var engine    = null;
  var sel       = null;   // selected square
  var moves_n   = 0;
  var t0        = Date.now();

  /* ── RN bridge ──────────────────────────────────────────────── */
  function rn(d) {
    try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(d)); } catch(e){}
  }

  /* ── Board size ─────────────────────────────────────────────── */
  function bsize() {
    var s = Math.min(window.innerWidth * 0.98, window.innerHeight - 208);
    return Math.max(240, s);
  }

  /* ── Labels ─────────────────────────────────────────────────── */
  function setupLabels() {
    var topClr = IS_AI ? AI_CLR : (CLR === 'white' ? 'black' : 'white');
    function av(id, c)    { var el = document.getElementById(id); el.className = 'player-avatar ' + (c==='white'?'avatar-white':'avatar-black'); el.textContent = c==='white'?'♔':'♚'; }
    function nm(id, t)    { document.getElementById(id).textContent = t; }
    function lb(id, c)    { document.getElementById(id).textContent = c==='white'?'Blancas':'Negras'; }
    av('avatar-top',    topClr);   nm('name-top',    IS_AI ? 'Stockfish' : 'Amigo');  lb('label-top',    topClr);
    av('avatar-bottom', CLR);      nm('name-bottom', 'Tú');                           lb('label-bottom', CLR);
  }

  /* ── Is player's turn ───────────────────────────────────────── */
  function myTurn() { return (game.turn()==='w') === (CLR==='white'); }

  /* ── Update UI ──────────────────────────────────────────────── */
  function updateUI() {
    if (game.game_over()) return;
    var st  = document.getElementById('status-text');
    var dbt = document.getElementById('dot-bottom');
    var dtp = document.getElementById('dot-top');

    if (IS_AI) {
      var my = myTurn();
      dbt.className = 'active-dot' + (my  ? ' on' : '');
      dtp.className = 'active-dot' + (!my ? ' on' : '');
      if (my) { st.style.color = '#f97316'; st.textContent = game.in_check() ? '¡Jaque! Tu turno' : 'Tu turno'; }
      else    { st.style.color = '#64748b'; st.textContent = 'Pensando...'; }
    } else {
      var wh = game.turn() === 'w';
      dbt.className = 'active-dot' + ((CLR==='white')===wh ? ' on' : '');
      dtp.className = 'active-dot' + ((CLR==='white')!==wh ? ' on' : '');
      st.style.color = '#f97316';
      st.textContent = game.in_check()
        ? '¡Jaque! ' + (wh ? 'Blancas' : 'Negras')
        : 'Turno: ' + (wh ? 'Blancas' : 'Negras');
    }
  }

  /* ── Game over modal ────────────────────────────────────────── */
  function showGameOver() {
    var winner, emoji, title, sub;
    if (game.in_checkmate()) {
      winner = game.turn()==='w' ? 'black' : 'white';
      var won = winner === CLR;
      emoji = won ? '🏆' : (IS_AI ? '🤖' : '🏆');
      title = won ? '¡Ganaste!' : (IS_AI ? 'Ganó Stockfish' : 'Ganan ' + (winner==='white'?'Blancas':'Negras'));
      sub   = 'Jaque mate · ' + moves_n + ' jugadas';
    } else {
      winner = 'draw';
      emoji = '🤝'; title = 'Tablas';
      sub   = game.in_stalemate() ? 'Ahogado'
            : game.in_threefold_repetition() ? 'Triple repetición'
            : game.insufficient_material() ? 'Material insuficiente'
            : '50 movimientos sin captura';
    }
    document.getElementById('result-emoji').textContent = emoji;
    document.getElementById('result-title').textContent = title;
    document.getElementById('result-sub').textContent   = sub;
    document.getElementById('gameover').classList.add('show');
    rn({ type:'gameOver', winner:winner, moves:moves_n, durationSeconds: Math.round((Date.now()-t0)/1000) });
  }

  /* ── Apply move ─────────────────────────────────────────────── */
  function applyMove(from, to) {
    var m = game.move({ from:from, to:to, promotion:'q' });
    if (!m) return false;
    moves_n++;
    board.position(game.fen());
    clearHL(); sel = null;
    updateUI();
    if (game.game_over()) { setTimeout(showGameOver, 400); return true; }
    if (IS_AI && !myTurn()) setTimeout(aiMove, 350);
    return true;
  }

  /* ── Highlights ─────────────────────────────────────────────── */
  function clearHL() { $('div.square-55d63').removeClass('sq-highlight-src sq-highlight-dst'); }
  function highlight(sq) {
    clearHL();
    $('[data-square="'+sq+'"]').addClass('sq-highlight-src');
    game.moves({ square:sq, verbose:true }).forEach(function(m){ $('[data-square="'+m.to+'"]').addClass('sq-highlight-dst'); });
  }

  /* ── Click to move ──────────────────────────────────────────── */
  function onSquareClick(sq) {
    if (game.game_over()) return;
    if (IS_AI && !myTurn()) return;

    var piece = game.get(sq);
    var ownPiece;
    if (IS_AI) {
      ownPiece = piece && ((CLR==='white'&&piece.color==='w')||(CLR==='black'&&piece.color==='b'));
    } else {
      ownPiece = piece && ((game.turn()==='w'&&piece.color==='w')||(game.turn()==='b'&&piece.color==='b'));
    }

    if (!sel) {
      if (!ownPiece) return;
      sel = sq; highlight(sq);
    } else {
      if (sq === sel) { sel=null; clearHL(); return; }
      if (!applyMove(sel, sq)) {
        if (ownPiece) { sel=sq; highlight(sq); }
        else          { sel=null; clearHL(); }
      }
    }
  }

  /* ── Drag handlers ──────────────────────────────────────────── */
  function onDragStart(src, piece) {
    if (game.game_over()) return false;
    if (IS_AI && !myTurn()) return false;
    if (IS_AI  && ((CLR==='white'&&piece[0]==='b')||(CLR==='black'&&piece[0]==='w'))) return false;
    if (!IS_AI && ((game.turn()==='w'&&piece[0]==='b')||(game.turn()==='b'&&piece[0]==='w'))) return false;
    clearHL(); sel=null; return true;
  }
  function onDrop(src, tgt) { if (!applyMove(src,tgt)) return 'snapback'; }
  function onSnapEnd()       { board.position(game.fen()); }

  /* ── AI move ────────────────────────────────────────────────── */
  function aiMove() {
    if (game.game_over()) return;
    if (engine) {
      engine.postMessage('position fen '+game.fen());
      engine.postMessage('go movetime 800');
    } else {
      var mvs = game.moves({ verbose:true });
      if (!mvs.length) return;
      var m = mvs[Math.floor(Math.random()*mvs.length)];
      setTimeout(function(){
        game.move({ from:m.from, to:m.to, promotion:'q' });
        moves_n++;
        board.position(game.fen());
        updateUI();
        if (game.game_over()) setTimeout(showGameOver, 400);
      }, 200);
    }
  }

  /* ── Init engine ────────────────────────────────────────────── */
  function initEngine(cb) {
    if (!IS_AI) { cb(); return; }
    fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
      .then(function(r){ return r.text(); })
      .then(function(code){
        var b = new Blob([code],{type:'application/javascript'});
        engine = new Worker(URL.createObjectURL(b));
        engine.postMessage('uci');
        engine.onmessage = function(e){
          if (typeof e.data === 'string' && e.data.startsWith('bestmove')) {
            var m = e.data.match(/bestmove ([a-h][1-8][a-h][1-8])([qrbn]?)/);
            if (m) {
              game.move({ from:m[1].slice(0,2), to:m[1].slice(2,4), promotion:m[2]||'q' });
              moves_n++;
              board.position(game.fen());
              updateUI();
              if (game.game_over()) setTimeout(showGameOver,400);
            }
          }
        };
        cb();
      }).catch(cb);
  }

  /* ── Init board ─────────────────────────────────────────────── */
  function initBoard() {
    var sz = bsize();
    document.getElementById('board-wrap').style.cssText = 'width:'+sz+'px;height:'+sz+'px;flex-shrink:0;position:relative;';
    document.getElementById('board').style.width = sz+'px';

    board = Chessboard('board', {
      draggable:     true,
      position:      'start',
      orientation:   CLR,
      onDragStart:   onDragStart,
      onDrop:        onDrop,
      onSnapEnd:     onSnapEnd,
      onSquareClick: onSquareClick,
      pieceTheme:    'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      moveSpeed:     'fast',
      snapSpeed:     50,
    });

    setupLabels();
    updateUI();
    if (IS_AI && CLR === 'black') setTimeout(aiMove, 600);
  }

  /* ── New game ───────────────────────────────────────────────── */
  function newGame() {
    game=new Chess(); board.start(); sel=null; moves_n=0; t0=Date.now();
    clearHL(); updateUI();
    document.getElementById('gameover').classList.remove('show');
    if (IS_AI && CLR==='black') setTimeout(aiMove,600);
  }

  /* ── Undo ───────────────────────────────────────────────────── */
  function undo() {
    if (IS_AI) { game.undo(); game.undo(); moves_n=Math.max(0,moves_n-2); }
    else        { game.undo(); moves_n=Math.max(0,moves_n-1); }
    board.position(game.fen()); clearHL(); sel=null; updateUI();
  }

  /* ── Wire up buttons ────────────────────────────────────────── */
  document.getElementById('btn-new').addEventListener('click', newGame);
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-play-again').addEventListener('click', newGame);
  document.getElementById('btn-close-result').addEventListener('click', function(){ document.getElementById('gameover').classList.remove('show'); });

  /* ── Boot ───────────────────────────────────────────────────── */
  $(document).ready(function(){ initEngine(initBoard); });
})();
</script>
</body>
</html>
